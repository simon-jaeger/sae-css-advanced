<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/assets/style.css" />
    <style>
      section {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      article {
        border: 1px solid;
        padding: 8px;
      }

      img {
        width: 100%;
        aspect-ratio: 2/1;
        object-fit: cover;
      }
    </style>
  </head>

  <body>
    <section>
      <article>
        <img src="https://placehold.co/200x100" alt="" style="" />
        <h2>alpha</h2>
        <p>lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
      </article>
      <article>
        <img src="https://placehold.co/200x150" alt="" style="" />
        <h2>bravo</h2>
        <p>lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
      </article>
    </section>
  </body>
</html>
