<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/assets/style.css" />
    <style>
      section {
        display: grid;
        gap: 8px;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 80px);
        grid-template-areas:
          "aside header header"
          "aside main main"
          "aside main main";
      }

      div {
        padding: 16px;
        border: 1px solid;
      }

      div:nth-child(1) {
        grid-area: main;
      }

      div:nth-child(2) {
        grid-area: header;
      }

      div:nth-child(3) {
        grid-area: aside;
      }
    </style>
  </head>

  <body>
    <section>
      <div>1</div>
      <div>header</div>
      <div>sidebar</div>
<!--      <div>4</div>-->
<!--      <div>5</div>-->
<!--      <div>6</div>-->
<!--      <div>7</div>-->
<!--      <div>8</div>-->
<!--      <div>9</div>-->
    </section>
  </body>
</html>
