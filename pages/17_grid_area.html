<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/assets/style.css" />
    <style>
      section {
        display: grid;
        gap: 8px;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 80px);
        grid-template-areas:
          "sidebar header  header"
          "sidebar content content"
          "sidebar content content";
      }

      div {
        padding: 16px;
        border: 1px solid;
      }

      div:nth-child(1) {
        grid-area: header;
      }

      div:nth-child(2) {
        grid-area: content;
      }

      div:nth-child(3) {
        grid-area: sidebar;
      }
    </style>
  </head>

  <body>
    <section>
      <div>1</div>
      <div>2</div>
      <div>3</div>
    </section>
  </body>
</html>
