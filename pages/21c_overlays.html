<!doctype html>
<html lang="en-us">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/assets/style.css" />
  <style>
    article {
      position: relative;
      width: 200px;
      height: 200px;
      border: 1px solid;
      background: url("https://placehold.co/50x50");
    }

    article div {
      opacity: 0;
      transition: all 1s;
      position: absolute;
      inset: 0;
      background: red;
    }

    article:hover div {
      opacity: 1;
    }

    article h2 {
      color: black;
    }

    article:hover {
      background: gray;
    }
  </style>
</head>

<body>
  <article>
    <div>
      <h2>Lorem</h2>
    </div>
  </article>
</body>
</html>
