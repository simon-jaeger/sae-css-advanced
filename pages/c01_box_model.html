<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/assets/style.css" />
    <style>
      h1 {
        font-size: 32px;
        background: #333;
        padding: 16px;
        border-left: 40px solid;
        border-bottom: 8px solid;
        margin-bottom: 40px;
      }

      div {
        border: 1px solid;
      }

      html {
        font-size: 16px; /* 1 rem */
      }
    </style>
  </head>

  <body>
    <h1>box model</h1>
    <div style="width: 160px">160px</div>
    <div style="width: 16rem">16rem</div>
    <div style="width: 50%">50%</div>
    <div style="width: 50vw">50vw</div>
    <div style="width: auto">auto</div>
    <div style="width: min-content">min-content example</div>
    <div style="width: max-content">max-content example</div>
  </body>
</html>
